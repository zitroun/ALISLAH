name: Build ALISLAH 2.1.4.17 Core APK (protected signing)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      ALISLAH_SIGNING_CERT_SHA256: 8DFE30742CE33C5DFC89E1F7928CEAD74F11925A67D653A12BD0141BBF1DB8EE
      ALISLAH_APK_MAX_BYTES: '5000000'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Load the existing signing key from GitHub Actions secrets
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ALISLAH_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ALISLAH_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ALISLAH_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ALISLAH_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing GitHub Actions secret: ALISLAH_${name/KEYSTORE_BASE64/KEYSTORE_BASE64}"
              echo "Add the four ALISLAH signing secrets using the Arabic setup guide before running this workflow."
              exit 1
            fi
          done
          KEYSTORE_PATH="$RUNNER_TEMP/alislah-signing.keystore"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"
          printf '%s\n' "ALISLAH_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          printf '%s\n' "ALISLAH_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          printf '%s\n' "ALISLAH_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          printf '%s\n' "ALISLAH_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
          echo "Existing ALISLAH signing key loaded from Actions secrets."

      - name: Locate Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          test -d "$SDK_ROOT" || { echo "::error::Android SDK not found: $SDK_ROOT"; exit 1; }
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print 2>/dev/null | sort -V | tail -n 1)"
          test -n "$SDKMANAGER" || { echo "::error::sdkmanager missing"; exit 1; }
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"

      - name: Install Android SDK 34 components
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print | sort -V | tail -n 1)"
          set +o pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null
          LICENSE_STATUS=${PIPESTATUS[1]}
          set -o pipefail
          test "$LICENSE_STATUS" -eq 0 || { echo "::error::Android SDK license acceptance failed"; exit "$LICENSE_STATUS"; }
          "$SDKMANAGER" --install "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Prepare isolated Gradle cache
        shell: bash
        run: |
          set -euo pipefail
          echo "GRADLE_USER_HOME=$RUNNER_TEMP/alislah-gradle-home" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/alislah-gradle-home"

      - name: Set up Gradle 8.14.6
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.14.6'
          cache-disabled: true

      - name: Unpack and preflight ALISLAH 2.1.4.17 source
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t ZIP_FILES < <(find . -maxdepth 4 -type f -name 'ALISLAH-Android-v2-source-2.1.4.17-protection-dashboard.zip' -print)
          if [ "${#ZIP_FILES[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one ALISLAH-Android-v2-source-2.1.4.17-protection-dashboard.zip, found ${#ZIP_FILES[@]}"
            exit 1
          fi
          unzip -q "${ZIP_FILES[0]}"
          ROOT="$PWD/ALISLAH-Android-v2"
          test -s "$ROOT/app/build.gradle"
          test -s "$ROOT/app/src/main/assets/index.html"
          test -s "$ROOT/app/src/main/assets/js/main.js"
          test -s "$ROOT/app/src/main/assets/js/voice-task-parser.js"
          test -s "$ROOT/app/src/main/java/dz/alislah/app/FloatingBubbleService.kt"
          test -s "$ROOT/app/src/main/java/dz/alislah/app/PrayerVoiceService.kt"
          test -s "$ROOT/tests/voice-task-parser.test.js"
          test -s "$ROOT/tests/voice-task-integration.test.py"
          test -s "$ROOT/app/src/main/assets/js/task-planner.js"
          test -s "$ROOT/app/src/main/java/dz/alislah/app/PrayerResponseReceiver.kt"
          test -s "$ROOT/tests/task-planner.test.js"
          test -s "$ROOT/tests/prayer-response.test.js"
          test -s "$ROOT/tests/native-feature-contracts.test.py"
          test -s "$ROOT/app/src/main/java/dz/alislah/app/ChildProtectionService.kt"
          test -s "$ROOT/app/src/main/assets/js/dashboard.js"
          test -s "$ROOT/tests/child-dashboard-contracts.test.py"
          grep -Fq "versionCode 47" "$ROOT/app/build.gradle"
          grep -Fq "versionName '2.1.4.17'" "$ROOT/app/build.gradle"
          grep -Fq 'audioControlMode' "$ROOT/app/src/main/assets/js/main.js"
          grep -Fq 'getAudioControlMode' "$ROOT/app/src/main/java/dz/alislah/app/MainActivity.kt"
          grep -Fq 'AudioManager.STREAM_MUSIC' "$ROOT/app/src/main/java/dz/alislah/app/MainActivity.kt"
          grep -Fq 'AudioAttributes.USAGE_MEDIA' "$ROOT/app/src/main/java/dz/alislah/app/PrayerVoiceService.kt"
          grep -Fq 'setAudioAttributes(attrs)' "$ROOT/app/src/main/java/dz/alislah/app/FloatingBubbleService.kt"
          grep -Fq 'assistantStopBubble' "$ROOT/app/src/main/java/dz/alislah/app/FloatingBubbleService.kt"
          grep -Fq 'EXTRA_SPEECH_INPUT_COMPLETE_SILENCE_LENGTH_MILLIS, 3000L' "$ROOT/app/src/main/java/dz/alislah/app/FloatingBubbleService.kt"
          grep -Fq 'data.pendingVoiceTask=draft' "$ROOT/app/src/main/assets/js/main.js"
          grep -Fq 'consumePrayerResponsesJson' "$ROOT/app/src/main/java/dz/alislah/app/MainActivity.kt"
          grep -Fq 'نعم، صليت' "$ROOT/app/src/main/java/dz/alislah/app/PrayerScheduler.kt"
          grep -Fq 'ليس بعد' "$ROOT/app/src/main/java/dz/alislah/app/PrayerScheduler.kt"
          grep -Fq 'findPostponeSlot' "$ROOT/app/src/main/assets/js/task-planner.js"
          grep -Fq 'recordUndo' "$ROOT/app/src/main/assets/js/main.js"
          grep -Fq 'quickComplete' "$ROOT/app/src/main/java/dz/alislah/app/FloatingBubbleService.kt"
          grep -Fq '__alislahShowQuickTaskAction' "$ROOT/app/src/main/assets/js/main.js"
          grep -Fq "versionCode 47" "$ROOT/app/build.gradle"
          grep -Fq "versionName '2.1.4.17'" "$ROOT/app/build.gradle"
          ! grep -R -E 'io\.flutter|implementation project\(.flutter.|include_flutter|FlutterEngine|FlutterInjector' "$ROOT/app/src/main" "$ROOT/app/build.gradle" "$ROOT/settings.gradle"
          ! find "$ROOT/app/src/main" -type f \( -name '*.onnx' -o -name '*.tflite' \) | grep -q .
          echo "ALISLAH core source preflight passed; no Mixer-TTS models or signing keystore included."

      - name: Verify permanent signing key before building
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE="$ALISLAH_KEYSTORE_PATH"
          ACTUAL_KEY_SHA256="$(keytool -list -v -keystore "$KEYSTORE" -storepass "$ALISLAH_KEYSTORE_PASSWORD" -alias "$ALISLAH_KEY_ALIAS" 2>/dev/null | awk -F': ' '/SHA256:/{gsub(":", "", $2); print toupper($2); exit}')"
          if [ "$ACTUAL_KEY_SHA256" != "$ALISLAH_SIGNING_CERT_SHA256" ]; then
            echo "::error::Signing key changed; refusing to build an APK that may not update the installed app."
            echo "Expected: $ALISLAH_SIGNING_CERT_SHA256"
            echo "Actual:   $ACTUAL_KEY_SHA256"
            exit 1
          fi
          echo "ALISLAH signing key verified unchanged."

      - name: Run source tests
        working-directory: ALISLAH-Android-v2
        shell: bash
        run: |
          set -euo pipefail
          node tests/prayer-calc.test.js
          node tests/voice-task-parser.test.js
          node tests/task-planner.test.js
          node tests/prayer-response.test.js
          python3 tests/voice-task-integration.test.py
          python3 tests/native-feature-contracts.test.py
          python3 tests/child-dashboard-contracts.test.py

      - name: Check modified JavaScript syntax
        working-directory: ALISLAH-Android-v2
        shell: bash
        run: |
          set -euo pipefail
          node --check app/src/main/assets/js/main.js
          node --check app/src/main/assets/js/task-planner.js
          node --check app/src/main/assets/js/prayer.js
          node --check app/src/main/assets/js/family.js
          node --check app/src/main/assets/js/dashboard.js

      - name: Build core APK without Flutter
        working-directory: ALISLAH-Android-v2
        shell: bash
        run: |
          set -euo pipefail
          gradle --version
          gradle --no-daemon --no-build-cache --stacktrace clean assembleDebug --rerun-tasks

      - name: Verify APK and report size
        shell: bash
        run: |
          set -euo pipefail
          APK="ALISLAH-Android-v2/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          SIZE="$(stat -c%s "$APK")"
          echo "Core APK size: $SIZE bytes"
          if [ "$SIZE" -gt "$ALISLAH_APK_MAX_BYTES" ]; then
            echo "::warning::Core APK exceeds the recommended 5 MB target; it will still be published."
          fi
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner -print | sort -V | tail -n 1)"
          test -n "$APKSIGNER" || { echo "::error::apksigner not found"; exit 1; }
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee "$RUNNER_TEMP/alislah-core-signature.txt"
          ACTUAL_APK_SHA256="$(sed -n 's/.*certificate SHA-256 digest: //p' "$RUNNER_TEMP/alislah-core-signature.txt" | head -n 1 | tr -d ':\r\n ' | tr '[:lower:]' '[:upper:]')"
          if [ "$ACTUAL_APK_SHA256" != "$ALISLAH_SIGNING_CERT_SHA256" ]; then
            echo "::error::APK signing certificate mismatch; artifact will not be published."
            echo "Expected: $ALISLAH_SIGNING_CERT_SHA256"
            echo "Actual:   $ACTUAL_APK_SHA256"
            exit 1
          fi
          echo "Core APK signature verified."

      - name: Upload ALISLAH 2.1.4.17 core APK
        uses: actions/upload-artifact@v7
        with:
          name: ALISLAH-2.1.4.17-Core-APK
          path: ALISLAH-Android-v2/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
