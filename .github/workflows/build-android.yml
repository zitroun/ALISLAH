name: Build ALISLAH 2.1.4.15 Core APK only

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      ALISLAH_SIGNING_CERT_SHA256: 8DFE30742CE33C5DFC89E1F7928CEAD74F11925A67D653A12BD0141BBF1DB8EE
      ALISLAH_APK_MAX_BYTES: '5000000'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          test -d "$SDK_ROOT" || { echo "::error::Android SDK not found: $SDK_ROOT"; exit 1; }
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print 2>/dev/null | sort -V | tail -n 1)"
          test -n "$SDKMANAGER" || { echo "::error::sdkmanager missing"; exit 1; }
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"

      - name: Install Android SDK 34 components
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print | sort -V | tail -n 1)"
          set +o pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null
          LICENSE_STATUS=${PIPESTATUS[1]}
          set -o pipefail
          test "$LICENSE_STATUS" -eq 0 || { echo "::error::Android SDK license acceptance failed"; exit "$LICENSE_STATUS"; }
          "$SDKMANAGER" --install "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Prepare isolated Gradle cache
        shell: bash
        run: |
          set -euo pipefail
          echo "GRADLE_USER_HOME=$RUNNER_TEMP/alislah-gradle-home" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/alislah-gradle-home"

      - name: Set up Gradle 8.14.6
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.14.6'
          cache-disabled: true

      - name: Locate, unpack and preflight ALISLAH 2.1.4.15 source
        shell: bash
        run: |
          set -euo pipefail

          # Prefer the corrected archive; fall back to the original 2.1.4.15 archive.
          FIXED_ZIP="$(find . -maxdepth 4 -type f -name 'ALISLAH-Android-v2-source-2.1.4.15-audio-control-options-fixed.zip' -print -quit)"
          if [ -n "$FIXED_ZIP" ]; then
            SOURCE_ZIP="$FIXED_ZIP"
          else
            mapfile -t ZIP_FILES < <(find . -maxdepth 4 -type f -name 'ALISLAH-Android-v2-source-2.1.4.15-audio-control-options.zip' -print)
            if [ "${#ZIP_FILES[@]}" -ne 1 ]; then
              echo "::error::Place exactly one 2.1.4.15 source ZIP in the repository. Found ${#ZIP_FILES[@]} original archives and no corrected archive."
              exit 1
            fi
            SOURCE_ZIP="${ZIP_FILES[0]}"
          fi

          echo "Using source archive: $SOURCE_ZIP"
          unzip -q "$SOURCE_ZIP"
          ROOT="$PWD/ALISLAH-Android-v2"

          test -s "$ROOT/debug.keystore"
          test -s "$ROOT/app/build.gradle"
          test -s "$ROOT/app/src/main/assets/index.html"
          test -s "$ROOT/app/src/main/assets/js/main.js"
          test -s "$ROOT/app/src/main/assets/js/voice-task-parser.js"
          test -s "$ROOT/app/src/main/java/dz/alislah/app/FloatingBubbleService.kt"
          test -s "$ROOT/app/src/main/java/dz/alislah/app/PrayerVoiceService.kt"
          test -s "$ROOT/tests/voice-task-parser.test.js"
          test -s "$ROOT/tests/voice-task-integration.test.py"

          grep -Fq "versionCode 45" "$ROOT/app/build.gradle"
          grep -Fq "versionName '2.1.4.15'" "$ROOT/app/build.gradle"
          grep -Fq 'audioControlMode' "$ROOT/app/src/main/assets/js/main.js"
          grep -Fq 'getAudioControlMode' "$ROOT/app/src/main/java/dz/alislah/app/MainActivity.kt"
          grep -Fq 'import android.media.AudioManager' "$ROOT/app/src/main/java/dz/alislah/app/MainActivity.kt"
          grep -Fq 'AudioManager.STREAM_MUSIC' "$ROOT/app/src/main/java/dz/alislah/app/MainActivity.kt"
          grep -Fq 'AudioAttributes.USAGE_MEDIA' "$ROOT/app/src/main/java/dz/alislah/app/PrayerVoiceService.kt"
          grep -Fq 'setAudioAttributes(attrs)' "$ROOT/app/src/main/java/dz/alislah/app/FloatingBubbleService.kt"
          grep -Fq 'assistantStopBubble' "$ROOT/app/src/main/java/dz/alislah/app/FloatingBubbleService.kt"
          grep -Fq 'EXTRA_SPEECH_INPUT_COMPLETE_SILENCE_LENGTH_MILLIS, 3000L' "$ROOT/app/src/main/java/dz/alislah/app/FloatingBubbleService.kt"
          grep -Fq 'data.pendingVoiceTask=draft' "$ROOT/app/src/main/assets/js/main.js"

          if grep -R -E 'io\.flutter|implementation project\(.flutter.|include_flutter|FlutterEngine|FlutterInjector' "$ROOT/app/src/main" "$ROOT/app/build.gradle" "$ROOT/settings.gradle"; then
            echo "::error::Unexpected Flutter dependency found in the core-only source."
            exit 1
          fi
          if find "$ROOT/app/src/main" -type f \( -name '*.onnx' -o -name '*.tflite' \) | grep -q .; then
            echo "::error::Unexpected large TTS model found; this build must not include Mixer-TTS."
            exit 1
          fi

          echo "ALISLAH 2.1.4.15 source preflight passed; Mixer-TTS models are not included."

      - name: Verify permanent signing key before building
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE="ALISLAH-Android-v2/debug.keystore"
          ACTUAL_KEY_SHA256="$(keytool -list -v -keystore "$KEYSTORE" -storepass android -alias androiddebugkey 2>/dev/null | awk -F': ' '/SHA256:/{gsub(":", "", $2); print toupper($2); exit}')"
          if [ "$ACTUAL_KEY_SHA256" != "$ALISLAH_SIGNING_CERT_SHA256" ]; then
            echo "::error::Signing key changed; refusing to build an APK that may not update the installed app."
            echo "Expected: $ALISLAH_SIGNING_CERT_SHA256"
            echo "Actual:   $ACTUAL_KEY_SHA256"
            exit 1
          fi
          echo "ALISLAH signing key verified unchanged."

      - name: Run source tests
        working-directory: ALISLAH-Android-v2
        shell: bash
        run: |
          set -euo pipefail
          node tests/prayer-calc.test.js
          node tests/voice-task-parser.test.js
          python3 tests/voice-task-integration.test.py

      - name: Build core APK without Flutter
        working-directory: ALISLAH-Android-v2
        shell: bash
        run: |
          set -euo pipefail
          gradle --version
          gradle --no-daemon --no-build-cache --stacktrace clean assembleDebug --rerun-tasks

      - name: Verify APK and report size
        shell: bash
        run: |
          set -euo pipefail
          APK="ALISLAH-Android-v2/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          SIZE="$(stat -c%s "$APK")"
          echo "Core APK size: $SIZE bytes"
          if [ "$SIZE" -gt "$ALISLAH_APK_MAX_BYTES" ]; then
            echo "::warning::Core APK exceeds the recommended 5 MB target; it will still be published."
          fi

          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner -print | sort -V | tail -n 1)"
          test -n "$APKSIGNER" || { echo "::error::apksigner not found"; exit 1; }
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee "$RUNNER_TEMP/alislah-core-signature.txt"

          ACTUAL_APK_SHA256="$(sed -n 's/.*certificate SHA-256 digest: //p' "$RUNNER_TEMP/alislah-core-signature.txt" | head -n 1 | tr -d ':\r\n ' | tr '[:lower:]' '[:upper:]')"
          if [ "$ACTUAL_APK_SHA256" != "$ALISLAH_SIGNING_CERT_SHA256" ]; then
            echo "::error::APK signing certificate mismatch; artifact will not be published."
            echo "Expected: $ALISLAH_SIGNING_CERT_SHA256"
            echo "Actual:   $ACTUAL_APK_SHA256"
            exit 1
          fi
          echo "Core APK signature verified."

      - name: Upload ALISLAH 2.1.4.15 core APK
        uses: actions/upload-artifact@v7
        with:
          name: ALISLAH-2.1.4.15-Core-APK
          path: ALISLAH-Android-v2/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
