name: Build ALISLAH Android APK
true:
  workflow_dispatch: null
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      ALISLAH_SIGNING_CERT_SHA256: 8DFE30742CE33C5DFC89E1F7928CEAD74F11925A67D653A12BD0141BBF1DB8EE
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
    - name: Set up Java 17
      uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: '17'
    - name: Locate the preinstalled Android SDK
      shell: bash
      run: "set -euo pipefail\nSDK_ROOT=\"${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}\"\
        \nif [ ! -d \"$SDK_ROOT\" ]; then\n  echo \"::error::Android SDK directory\
        \ was not found: $SDK_ROOT\"\n  exit 1\nfi\nSDKMANAGER=\"$(find \"$SDK_ROOT/cmdline-tools\"\
        \ -type f -name sdkmanager -print 2>/dev/null | sort -V | tail -n 1)\"\nif\
        \ [ -z \"$SDKMANAGER\" ]; then\n  echo \"::error::sdkmanager is missing from\
        \ the runner's preinstalled Android SDK.\"\n  exit 1\nfi\necho \"ANDROID_HOME=$SDK_ROOT\"\
        \ >> \"$GITHUB_ENV\"\necho \"ANDROID_SDK_ROOT=$SDK_ROOT\" >> \"$GITHUB_ENV\"\
        \necho \"$SDK_ROOT/platform-tools\" >> \"$GITHUB_PATH\"\necho \"$(dirname\
        \ \"$SDKMANAGER\")\" >> \"$GITHUB_PATH\"\necho \"Using existing Android SDK\
        \ at $SDK_ROOT\"\n"
    - name: Install Android SDK 34 components
      shell: bash
      run: "set -euo pipefail\nSDKMANAGER=\"$(find \"$ANDROID_HOME/cmdline-tools\"\
        \ -type f -name sdkmanager -print | sort -V | tail -n 1)\"\ntest -n \"$SDKMANAGER\"\
        \n# Accept licenses without allowing yes(1)'s expected SIGPIPE to fail the\
        \ job.\nset +o pipefail\nyes | \"$SDKMANAGER\" --licenses >/dev/null\nLICENSE_STATUS=${PIPESTATUS[1]}\n\
        set -o pipefail\nif [ \"$LICENSE_STATUS\" -ne 0 ]; then\n  echo \"::error::Android\
        \ SDK license acceptance failed.\"\n  exit \"$LICENSE_STATUS\"\nfi\n\"$SDKMANAGER\"\
        \ --install \"platform-tools\" \"platforms;android-34\" \"build-tools;34.0.0\"\
        \n"
    - name: Configure isolated Gradle cache
      shell: bash
      run: 'set -euo pipefail

        echo "GRADLE_USER_HOME=$RUNNER_TEMP/alislah-gradle-home" >> "$GITHUB_ENV"

        '
    - name: Prepare isolated Gradle cache
      shell: bash
      run: 'set -euo pipefail

        rm -rf "$GRADLE_USER_HOME"

        mkdir -p "$GRADLE_USER_HOME"

        echo "Using a fresh Gradle cache at $GRADLE_USER_HOME"

        '
    - name: Set up Gradle 8.13 (required by Android Gradle Plugin 8.11.1)
      uses: gradle/actions/setup-gradle@v6
      with:
        gradle-version: '8.13'
        cache-disabled: true
    - name: Unpack exactly one Android source archive
      shell: bash
      run: "set -euo pipefail\nmapfile -t ZIP_FILES < <(find . -maxdepth 2 -type f\
        \ -name 'ALISLAH-Android-v2-source.zip' -print)\nif [ \"${#ZIP_FILES[@]}\"\
        \ -ne 1 ]; then\n  echo \"::error::Expected exactly one ALISLAH-Android-v2-source.zip,\
        \ found ${#ZIP_FILES[@]}\"\n  exit 1\nfi\n# Remove any checked-out/stale source\
        \ tree before extracting the selected archive.\n# This prevents Gradle from\
        \ compiling leftover files or reusing an old APK.\nrm -rf ALISLAH-Android-v2\n\
        unzip -o \"${ZIP_FILES[0]}\"\ntest -s ALISLAH-Android-v2/debug.keystore\n\
        test -s ALISLAH-Android-v2/app/build.gradle\necho \"Source archive extracted\
        \ into a clean directory.\"\n"
    - name: Remove optional Mixer-TTS source assets
      shell: bash
      run: 'set -euo pipefail

        # ALISLAH is built without the optional Mixer-TTS engine or its model files.

        rm -rf ALISLAH-Android-v2/flutter_tts_module

        rm -rf ALISLAH-Android-v2/flutter_tts_generated

        echo "Mixer-TTS has been excluded from this APK build."

        '
    - name: Remove Mixer-TTS and Flutter integration cleanly
      shell: bash
      run: "set -euo pipefail\npython3 - <<'PYFIX'\nfrom pathlib import Path\nimport\
        \ re\nroot = Path('ALISLAH-Android-v2')\n\n# Remove the obsolete Flutter module\
        \ include from Gradle settings.\nsettings = root / 'settings.gradle'\nlines\
        \ = settings.read_text(encoding='utf-8').splitlines()\nkept = [line for line\
        \ in lines if not re.search(\n    r'flutter_tts_generated|include_flutter\\\
        .groovy|include\\s*\\(?\\s*[\\'\\\"]:flutter[\\'\\\"]', line\n)]\nsettings.write_text('\\\
        n'.join(line for line in kept if 'CI workflow generates this Flutter module'\
        \ not in line and 'setBinding(new Binding' not in line) + '\\n', encoding='utf-8')\n\
        \n# The app's only Gradle dependency on Flutter is the Mixer-TTS engine.\n\
        app_gradle = root / 'app/build.gradle'\ntext = app_gradle.read_text(encoding='utf-8')\n\
        text = re.sub(r\"(?m)^\\s*implementation\\s+project\\s*\\(\\s*['\\\"]:flutter['\\\
        \"]\\s*\\)\\s*;?\\s*$\\n?\", '', text)\napp_gradle.write_text(text, encoding='utf-8')\n\
        \n# Remove Flutter engine imports, state, and lifecycle methods from MainActivity.\n\
        main = root / 'app/src/main/java/dz/alislah/app/MainActivity.kt'\ns = main.read_text(encoding='utf-8')\n\
        s = re.sub(r'(?m)^import io\\.flutter\\.[^\\n]*\\n', '', s)\ns = re.sub(r'(?m)^\\\
        s*private var mixerFlutterEngine:.*\\n', '', s)\ns = re.sub(r'(?m)^\\s*private\
        \ var mixerTtsChannel:.*\\n', '', s)\ns = re.sub(r'(?m)^\\s*private var mixerTtsReady\\\
        s*=.*\\n', '', s)\ns = re.sub(r'(?m)^\\s*private var pendingMixerTtsText:.*\\\
        n', '', s)\nstart = s.find('    private fun dispatchMixerVoiceStatus(')\n\
        end = s.find('    override fun onCreate(', start)\nif start != -1 and end\
        \ != -1:\n    s = s[:start] + s[end:]\ns = re.sub(r'(?m)^\\s*try \\{ stopMixerTts\\\
        (\\); mixerFlutterEngine\\?\\.destroy\\(\\) \\} catch \\(_:\\s*Exception\\\
        ) \\{ \\}\\n', '', s)\ns = re.sub(r'(?m)^\\s*mixerFlutterEngine = null\\n',\
        \ '', s)\ns = re.sub(r'(?m)^\\s*mixerTtsChannel = null\\n', '', s)\ns = re.sub(r'(?m)^\\\
        s*mixerTtsReady = false\\n', '', s)\n# Replace the bridge methods that previously\
        \ invoked Mixer-TTS with the existing native TTS service.\nstart = s.find('\
        \        @JavascriptInterface fun speakDisplayedAyah(text: String)')\nend\
        \ = s.find('        @JavascriptInterface fun playAdhanTest()', start)\nif\
        \ start == -1 or end == -1:\n    raise SystemExit('Could not locate assistant\
        \ voice bridge block in MainActivity.kt')\nbridge = '''        private fun\
        \ speakWithExistingAssistant(text: String) {\n            val clean = text.trim().take(700)\n\
        \            if (clean.isBlank()) return\n            val i = Intent(this@MainActivity,\
        \ FloatingBubbleService::class.java).apply {\n                action = FloatingBubbleService.ACTION_SPEAK_TEXT\n\
        \                putExtra(FloatingBubbleService.EXTRA_SPEAK_TEXT, clean)\n\
        \            }\n            try {\n                if (Build.VERSION.SDK_INT\
        \ >= Build.VERSION_CODES.O) startForegroundService(i) else startService(i)\n\
        \            } catch (_: Exception) { }\n        }\n        @JavascriptInterface\
        \ fun speakDisplayedAyah(text: String) { runOnUiThread { speakWithExistingAssistant(text)\
        \ } }\n        @JavascriptInterface fun speakAssistantText(text: String) {\
        \ runOnUiThread { speakWithExistingAssistant(text) } }\n        @JavascriptInterface\
        \ fun stopAssistantSpeech() { runOnUiThread {\n            try {\n       \
        \         val i = Intent(this@MainActivity, FloatingBubbleService::class.java).apply\
        \ { action = FloatingBubbleService.ACTION_STOP_SPEECH }\n                if\
        \ (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) startForegroundService(i)\
        \ else startService(i)\n            } catch (_: Exception) { }\n        }\
        \ }\n        @JavascriptInterface fun setAssistantVoiceMode(mode: String)\
        \ { prefs.edit().putString(\"voiceMode\", if (mode == \"text\" || mode ==\
        \ \"voice\" || mode == \"both\") mode else \"both\").apply() }\n        @JavascriptInterface\
        \ fun testAssistantVoice() { runOnUiThread {\n            try {\n        \
        \        val i = Intent(this@MainActivity, FloatingBubbleService::class.java).apply\
        \ { action = FloatingBubbleService.ACTION_SPEAK_TEST }\n                if\
        \ (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) startForegroundService(i)\
        \ else startService(i)\n            } catch (_: Exception) { }\n        }\
        \ }\n'''\ns = s[:start] + bridge + s[end:]\n# Keep the legacy voice as the\
        \ only selectable engine in this build.\ns = re.sub(r'@JavascriptInterface\
        \ fun setAssistantVoiceEngine\\(engine: String\\) \\{[^}]*\\}',\n        \
        \   '@JavascriptInterface fun setAssistantVoiceEngine(engine: String) { prefs.edit().putString(\"\
        assistantVoiceEngine\", \"old\").apply() }', s)\nmain.write_text(s, encoding='utf-8')\n\
        \n\n# Force the floating assistant to use its existing Android TTS engine\
        \ (with local fallback).\nservice = root / 'app/src/main/java/dz/alislah/app/FloatingBubbleService.kt'\n\
        svc = service.read_text(encoding='utf-8')\nstart = svc.find('        // The\
        \ selected engine controls assistant speech and displayed Quran verses alike.')\n\
        end = svc.find('    }\\n\\n    private fun speakWithAndroidTts', start)\n\
        if start != -1 and end != -1:\n    svc = svc[:start] + '        speakWithAndroidTts(speechText,\
        \ quranLike)\\n' + svc[end:]\nsvc = re.sub(r'@JavascriptInterface fun setAssistantVoiceEngine\\\
        (engine: String\\) \\{[^}]*\\}',\n             '@JavascriptInterface fun setAssistantVoiceEngine(engine:\
        \ String) { prefs().edit().putString(\"assistantVoiceEngine\", \"old\").apply()\
        \ }', svc)\nsvc = svc.replace('assistantWebView?.evaluateJavascript(\"window.AlishlahNeuralVoice&&window.AlishlahNeuralVoice.stop()\"\
        , null); stopReminderSpeech()', 'stopReminderSpeech()')\nstart = svc.find('\
        \        @JavascriptInterface fun onNeuralSpeechResult(success: Boolean, detail:\
        \ String)')\nend = svc.find('        @JavascriptInterface fun setAssistantVoiceMode(',\
        \ start)\nif start != -1 and end != -1:\n    svc = svc[:start] + svc[end:]\n\
        service.write_text(svc, encoding='utf-8')\n\n# Remove the obsolete neural\
        \ engine script from the app page.\nindex = root / 'app/src/main/assets/index.html'\n\
        html = index.read_text(encoding='utf-8')\nhtml = html.replace('<script src=\"\
        js/neural-voice.js\"></script>', '')\nindex.write_text(html, encoding='utf-8')\n\
        \n# Make the voice settings UI expose only the existing native assistant.\n\
        js = root / 'app/src/main/assets/js/main.js'\njs_text = js.read_text(encoding='utf-8')\n\
        js_text = js_text.replace('<option value=\"old\">المساعد القديم (محلي)</option><option\
        \ value=\"neural\">المساعد العربي العصبي الجديد (محلي)</option>',\n      \
        \                    '<option value=\"old\">المساعد الحالي (محلي)</option>')\n\
        js_text = js_text.replace(\"engineSelect.value=data.settings.assistantVoiceEngine||'neural';\"\
        , \"engineSelect.value='old';data.settings.assistantVoiceEngine='old';\")\n\
        js_text = js_text.replace(\"engineSelect.value==='neural'?'المحرك المختار:\
        \ العصبي الجديد — يعمل محليًا دون إنترنت':'المحرك المختار: القديم — يعمل محليًا'\"\
        , \"'المساعد الحالي يعمل محليًا'\")\njs.write_text(js_text, encoding='utf-8')\n\
        \n# Delete the now-unused Mixer-TTS assets/modules.\nfor rel in ('flutter_tts_module',\
        \ 'flutter_tts_generated'):\n    p = root / rel\n    if p.exists():\n    \
        \    import shutil\n        shutil.rmtree(p)\nvoice_js = root / 'app/src/main/assets/js/neural-voice.js'\n\
        if voice_js.exists():\n    voice_js.unlink()\n\n# Fail early if Gradle or\
        \ native source still references the removed Flutter engine.\nchecks = [settings,\
        \ app_gradle, main, service, index, js]\npatterns = re.compile(r'flutter_tts_generated|include_flutter\\\
        .groovy|project\\s*\\(\\s*[\\'\\\"]:flutter[\\'\\\"]\\s*\\)|io\\.flutter\\\
        .|mixerFlutterEngine|mixerTtsChannel|mixerTtsReady|speakMixerTts|stopMixerTts|onNeuralSpeechResult|Mixer-TTS',\
        \ re.I)\nleftovers = []\nfor f in checks:\n    for n, line in enumerate(f.read_text(encoding='utf-8').splitlines(),\
        \ 1):\n        if patterns.search(line):\n            leftovers.append(f'{f}:{n}:{line.strip()}')\n\
        if leftovers:\n    raise SystemExit('Mixer/Flutter references remain:\\n'\
        \ + '\\n'.join(leftovers))\nprint('Mixer-TTS removed: Gradle settings/dependency,\
        \ native Flutter engine bridge, and neural voice UI.')\nPYFIX\n"
    - name: Verify and install permanent signing key
      shell: bash
      run: "set -euo pipefail\nKEYSTORE=\"ALISLAH-Android-v2/debug.keystore\"\ntest\
        \ -s \"$KEYSTORE\"\nmkdir -p \"$HOME/.android\"\ncp \"$KEYSTORE\" \"$HOME/.android/debug.keystore\"\
        \nchmod 600 \"$HOME/.android/debug.keystore\"\nACTUAL_KEY_SHA256=\"$(keytool\
        \ -list -v \\\n  -keystore \"$HOME/.android/debug.keystore\" \\\n  -storepass\
        \ android \\\n  -alias androiddebugkey 2>/dev/null \\\n  | awk -F': ' '/SHA256:/{gsub(\"\
        :\", \"\", $2); print toupper($2); exit}')\"\nif [ \"$ACTUAL_KEY_SHA256\"\
        \ != \"$ALISLAH_SIGNING_CERT_SHA256\" ]; then\n  echo \"::warning title=Signing\
        \ certificate differs::This APK will still be built and published, but Android\
        \ may reject it as an update over the currently installed ALISLAH version.\
        \ You may need to uninstall the old app first; uninstalling can erase local\
        \ app data unless backed up.\"\n  echo \"Expected certificate SHA-256: $ALISLAH_SIGNING_CERT_SHA256\"\
        \n  echo \"Actual keystore SHA-256:       $ACTUAL_KEY_SHA256\"\n  echo \"\
        SIGNING_KEY_MATCH=false\" >> \"$GITHUB_ENV\"\nelse\n  echo \"Permanent ALISLAH\
        \ signing key matches the expected certificate.\"\n  echo \"SIGNING_KEY_MATCH=true\"\
        \ >> \"$GITHUB_ENV\"\nfi\n"
    - name: Confirm app signing configuration
      working-directory: ALISLAH-Android-v2
      shell: bash
      run: 'set -euo pipefail

        grep -Fq "storeFile rootProject.file(''debug.keystore'')" app/build.gradle

        grep -Fq "signingConfig signingConfigs.alislah" app/build.gradle

        echo "The debug variant is configured to use the preserved ALISLAH keystore."

        '
    - name: Run ALISLAH source checks
      working-directory: ALISLAH-Android-v2
      shell: bash
      run: 'set -euo pipefail

        node tests/prayer-calc.test.js

        '
    - name: Build APK from a clean state
      working-directory: ALISLAH-Android-v2
      shell: bash
      run: 'set -euo pipefail

        gradle --no-daemon --no-build-cache --stacktrace clean assembleDebug --rerun-tasks

        gradle --no-daemon signingReport

        '
    - name: Verify APK signature before publishing
      shell: bash
      run: "set -euo pipefail\nAPK=\"ALISLAH-Android-v2/app/build/outputs/apk/debug/app-debug.apk\"\
        \ntest -s \"$APK\"\nAPKSIGNER=\"$(find \"$ANDROID_HOME/build-tools\" -type\
        \ f -name apksigner -print | sort -V | tail -n 1)\"\nif [ -z \"$APKSIGNER\"\
        \ ]; then\n  echo \"::error::apksigner not found; refusing to publish unchecked\
        \ APK.\"\n  exit 1\nfi\n\"$APKSIGNER\" verify --verbose --print-certs \"$APK\"\
        \ | tee \"$RUNNER_TEMP/alislah-apk-signature.txt\"\nACTUAL_APK_SHA256=\"$(sed\
        \ -n 's/.*certificate SHA-256 digest: //p' \"$RUNNER_TEMP/alislah-apk-signature.txt\"\
        \ | head -n 1 | tr -d ':\\r\\n ' | tr '[:lower:]' '[:upper:]')\"\nif [ \"\
        $ACTUAL_APK_SHA256\" != \"$ALISLAH_SIGNING_CERT_SHA256\" ]; then\n  echo \"\
        ::warning title=APK update compatibility warning::The APK is validly signed,\
        \ but its signing certificate differs from the expected installed-app certificate.\
        \ The APK artifact will still be published. Android will normally refuse an\
        \ in-place update; uninstall the existing ALISLAH app before installing this\
        \ APK. Back up local data first because uninstalling may erase it.\"\n  echo\
        \ \"Expected certificate SHA-256: $ALISLAH_SIGNING_CERT_SHA256\"\n  echo \"\
        Actual APK certificate SHA-256: $ACTUAL_APK_SHA256\"\n  echo \"APK_UPDATE_COMPATIBLE=false\"\
        \ >> \"$GITHUB_ENV\"\nelse\n  echo \"APK signature matches the expected ALISLAH\
        \ certificate.\"\n  echo \"APK_UPDATE_COMPATIBLE=true\" >> \"$GITHUB_ENV\"\
        \nfi\n"
    - name: Upload APK
      uses: actions/upload-artifact@v7
      with:
        name: ALISLAH-all-in-one-apk
        path: ALISLAH-Android-v2/app/build/outputs/apk/debug/app-debug.apk
        if-no-files-found: error
    - name: Publish compatibility warning in workflow summary
      if: always()
      shell: bash
      run: "{\n  echo \"## ALISLAH APK signing compatibility\"\n  if [ \"${APK_UPDATE_COMPATIBLE:-false}\"\
        \ = \"true\" ]; then\n    echo \"- Signing certificate matches the expected\
        \ certificate. In-place update should be compatible, subject to Android package/version\
        \ rules.\"\n  else\n    echo \"- **WARNING:** APK was allowed to publish despite\
        \ a signing-certificate mismatch.\"\n    echo \"- Android will normally reject\
        \ installation over an existing ALISLAH installation signed with a different\
        \ key.\"\n    echo \"- Back up app data, then uninstall the old app before\
        \ installing this APK. Uninstalling may erase local data.\"\n  fi\n} >> \"\
        $GITHUB_STEP_SUMMARY\"\n"
