name: Build ALISLAH Android APK
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2.1'
      - name: Unpack Android project
        run: |
          ZIP="$(find . -maxdepth 2 -name 'ALISLAH-Android-v2-source.zip' -print -quit)"
          if [ -z "$ZIP" ]; then echo 'Android project ZIP not found'; exit 1; fi
          unzip -o "$ZIP"
      - name: Keep signing identity stable between builds
        run: |
          mkdir -p "$HOME/.android"
          cp ALISLAH-Android-v2/debug.keystore "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
      - name: Build debug APK
        working-directory: ALISLAH-Android-v2
        run: gradle assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ALISLAH-all-in-one-apk
          path: ALISLAH-Android-v2/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
