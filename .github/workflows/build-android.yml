name: Build ALISLAH Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ALISLAH_SIGNING_CERT_SHA256: 8DFE30742CE33C5DFC89E1F7928CEAD74F11925A67D653A12BD0141BBF1DB8EE

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2.1'

      - name: Unpack exactly one Android project source
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t ZIP_FILES < <(find . -maxdepth 2 -type f -name 'ALISLAH-Android-v2-source.zip' -print)
          if [ "${#ZIP_FILES[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one source ZIP, found ${#ZIP_FILES[@]}"
            exit 1
          fi
          unzip -o "${ZIP_FILES[0]}"

      - name: Verify permanent signing key
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE="ALISLAH-Android-v2/debug.keystore"
          test -s "$KEYSTORE"
          mkdir -p "$HOME/.android"
          cp "$KEYSTORE" "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"

          ACTUAL_KEY_SHA256="$(keytool -list -v \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey 2>/dev/null \
            | awk -F': ' '/SHA256:/{gsub(":", "", $2); print toupper($2); exit}')"

          if [ "$ACTUAL_KEY_SHA256" != "$ALISLAH_SIGNING_CERT_SHA256" ]; then
            echo "::error::Signing key changed. Build stopped."
            echo "Expected: $ALISLAH_SIGNING_CERT_SHA256"
            echo "Actual:   $ACTUAL_KEY_SHA256"
            exit 1
          fi

          echo "Permanent signing key verified."

      - name: Build APK
        working-directory: ALISLAH-Android-v2
        run: gradle assembleDebug

      - name: Verify APK signature
        shell: bash
        run: |
          set -euo pipefail
          APK="ALISLAH-Android-v2/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"

          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner -print | sort -V | tail -n 1)"
          if [ -z "$APKSIGNER" ]; then
            echo "::error::apksigner not found."
            exit 1
          fi

          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee "$RUNNER_TEMP/signature.txt"

          ACTUAL_APK_SHA256="$(sed -n 's/.*certificate SHA-256 digest: //p' "$RUNNER_TEMP/signature.txt" | head -n 1 | tr -d ':\r\n ' | tr '[:lower:]' '[:upper:]')"

          if [ "$ACTUAL_APK_SHA256" != "$ALISLAH_SIGNING_CERT_SHA256" ]; then
            echo "::error::APK signature mismatch. Artifact will not be published."
            echo "Expected: $ALISLAH_SIGNING_CERT_SHA256"
            echo "Actual:   $ACTUAL_APK_SHA256"
            exit 1
          fi

          echo "APK signature verified."

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ALISLAH-all-in-one-apk
          path: ALISLAH-Android-v2/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
