
name: Build ALISLAH Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2.1'

      - name: Unpack Android project
        run: unzip -o ALISLAH-Android-v2-source.zip

      - name: Build APK
        working-directory: ALISLAH-Android-v2
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ALISLAH-debug-apk
          path: ALISLAH-Android-v2/app/build/outputs/apk/debug/app-debug.apk
