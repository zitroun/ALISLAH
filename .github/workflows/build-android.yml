name: Build ALISLAH small APK + optional Mixer-TTS voice pack

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      ALISLAH_SIGNING_CERT_SHA256: 8DFE30742CE33C5DFC89E1F7928CEAD74F11925A67D653A12BD0141BBF1DB8EE
      ALISLAH_APK_MAX_BYTES: '5000000'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate the preinstalled Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          test -d "$SDK_ROOT" || { echo "::error::Android SDK not found: $SDK_ROOT"; exit 1; }
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print 2>/dev/null | sort -V | tail -n 1)"
          test -n "$SDKMANAGER" || { echo "::error::sdkmanager missing from Android SDK"; exit 1; }
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"

      - name: Install Android SDK 34 components
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print | sort -V | tail -n 1)"
          test -n "$SDKMANAGER"
          set +o pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null
          LICENSE_STATUS=${PIPESTATUS[1]}
          set -o pipefail
          if [ "$LICENSE_STATUS" -ne 0 ]; then
            echo "::error::Android SDK license acceptance failed."
            exit "$LICENSE_STATUS"
          fi
          "$SDKMANAGER" --install "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Configure a clean Gradle cache
        shell: bash
        run: |
          set -euo pipefail
          echo "GRADLE_USER_HOME=$RUNNER_TEMP/alislah-gradle-home" >> "$GITHUB_ENV"

      - name: Prepare a fresh Gradle cache
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GRADLE_USER_HOME"
          mkdir -p "$GRADLE_USER_HOME"

      - name: Set up Gradle 8.14.6
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.14.6'
          cache-disabled: true

      - name: Unpack and preflight ALISLAH 2.1.4.9 source
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t ZIP_FILES < <(find . -maxdepth 2 -type f -name 'ALISLAH-Android-v2-source.zip' -print)
          if [ "${#ZIP_FILES[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one ALISLAH-Android-v2-source.zip, found ${#ZIP_FILES[@]}"
            exit 1
          fi
          rm -rf ALISLAH-Android-v2 ALISLAH-Voice-Pack
          unzip -q "${ZIP_FILES[0]}"
          ROOT="$PWD/ALISLAH-Android-v2"
          PACK="$PWD/ALISLAH-Voice-Pack"
          test -s "$ROOT/debug.keystore"
          test -s "$ROOT/app/build.gradle"
          test -s "$ROOT/app/src/main/java/dz/alislah/app/OptionalVoicePackBridge.kt"
          test -s "$PACK/app/src/main/java/dz/alislah/voicepack/VoicePackService.kt"
          grep -Fq "versionCode 39" "$ROOT/app/build.gradle"
          grep -Fq "versionName '2.1.4.9'" "$ROOT/app/build.gradle"
          ! grep -R -E 'io\.flutter|implementation project\(.flutter.|include_flutter|FlutterEngine|FlutterInjector' "$ROOT/app/src/main" "$ROOT/app/build.gradle" "$ROOT/settings.gradle"
          ! find "$ROOT/app/src/main" -type f \( -name '*.onnx' -o -name '*.tflite' \) | grep -q .
          python3 "$ROOT/tests/verify-optional-voice-pack.py"
          echo "ALISLAH core is Flutter-free; Mixer-TTS is isolated in the optional companion app."

      - name: Verify permanent signing key before building
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE="ALISLAH-Android-v2/debug.keystore"
          ACTUAL_KEY_SHA256="$(keytool -list -v -keystore "$KEYSTORE" -storepass android -alias androiddebugkey 2>/dev/null | awk -F': ' '/SHA256:/{gsub(":", "", $2); print toupper($2); exit}')"
          if [ "$ACTUAL_KEY_SHA256" != "$ALISLAH_SIGNING_CERT_SHA256" ]; then
            echo "::error::Signing key changed; refusing to build an APK that may not update the installed app."
            echo "Expected: $ALISLAH_SIGNING_CERT_SHA256"
            echo "Actual:   $ACTUAL_KEY_SHA256"
            exit 1
          fi
          cp "$KEYSTORE" ALISLAH-Voice-Pack/debug.keystore
          echo "ALISLAH signing key verified and copied unchanged to the optional voice pack."

      - name: Run ALISLAH source tests
        working-directory: ALISLAH-Android-v2
        shell: bash
        run: |
          set -euo pipefail
          node tests/prayer-calc.test.js

      - name: Build the small core APK without Flutter
        working-directory: ALISLAH-Android-v2
        shell: bash
        run: |
          set -euo pipefail
          gradle --version
          gradle --no-daemon --no-build-cache --stacktrace clean assembleDebug --rerun-tasks

      - name: Warn if core APK exceeds 5 MB and verify signature
        shell: bash
        run: |
          set -euo pipefail
          APK="ALISLAH-Android-v2/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          SIZE="$(stat -c%s "$APK")"
          echo "Core APK size: $SIZE bytes"
          if [ "$SIZE" -gt "$ALISLAH_APK_MAX_BYTES" ]; then
            echo "::warning::Core APK exceeds the recommended 5,000,000-byte target ($SIZE bytes). The APK will still be verified and published."
          else
            echo "Core APK is within the recommended 5,000,000-byte target."
          fi
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner -print | sort -V | tail -n 1)"
          test -n "$APKSIGNER" || { echo "::error::apksigner not found"; exit 1; }
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee "$RUNNER_TEMP/alislah-core-signature.txt"
          ACTUAL_APK_SHA256="$(sed -n 's/.*certificate SHA-256 digest: //p' "$RUNNER_TEMP/alislah-core-signature.txt" | head -n 1 | tr -d ':\r\n ' | tr '[:lower:]' '[:upper:]')"
          if [ "$ACTUAL_APK_SHA256" != "$ALISLAH_SIGNING_CERT_SHA256" ]; then
            echo "::error::Core APK signing certificate mismatch; artifact will not be published."
            exit 1
          fi
          echo "Core APK signature verified; size advisory completed."

      - name: Upload the core ALISLAH APK
        uses: actions/upload-artifact@v7
        with:
          name: ALISLAH-2.1.4.9-Core-APK
          path: ALISLAH-Android-v2/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Set up Flutter only for the optional voice pack
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: Generate optional Flutter voice module and download its models
        shell: bash
        run: |
          set -euo pipefail
          PACK="$PWD/ALISLAH-Voice-Pack"
          MODULE="$PACK/flutter_tts_generated"
          rm -rf "$MODULE"
          flutter create --template=module --org dz.alislah.voicepack --project-name alislah_tts "$MODULE"
          cp -a ALISLAH-Android-v2/flutter_tts_module/lib/. "$MODULE/lib/"
          cp ALISLAH-Android-v2/flutter_tts_module/pubspec.yaml "$MODULE/pubspec.yaml"
          mkdir -p "$MODULE/assets/models"
          curl --fail --location --retry 3 --retry-delay 2 \
            "https://huggingface.co/nipponjo/tts-arabic-onnx/resolve/main/mixer128.onnx?download=true" \
            -o "$MODULE/assets/models/mixer128.onnx"
          curl --fail --location --retry 3 --retry-delay 2 \
            "https://huggingface.co/nipponjo/tts-arabic-onnx/resolve/main/vocos22.onnx?download=true" \
            -o "$MODULE/assets/models/vocos22.onnx"
          curl --fail --location --retry 3 --retry-delay 2 \
            "https://huggingface.co/nipponjo/tts-arabic-onnx/resolve/main/shakkelha.onnx?download=true" \
            -o "$MODULE/assets/models/shakkelha.onnx"
          test "$(stat -c%s "$MODULE/assets/models/mixer128.onnx")" -gt 1000000
          test "$(stat -c%s "$MODULE/assets/models/vocos22.onnx")" -gt 10000000
          test "$(stat -c%s "$MODULE/assets/models/shakkelha.onnx")" -gt 1000000
          (cd "$MODULE" && flutter pub get)
          test -s "$MODULE/.android/include_flutter.groovy"
          echo "The optional offline Arabic voice models are ready."

      - name: Verify optional voice pack integration and shared signature
        shell: bash
        run: |
          set -euo pipefail
          PACK="$PWD/ALISLAH-Voice-Pack"
          grep -Fq "flutter_tts_generated/.android/include_flutter.groovy" "$PACK/settings.gradle"
          grep -Fq "implementation project(':flutter')" "$PACK/app/build.gradle"
          grep -Fq "storeFile rootProject.file('debug.keystore')" "$PACK/app/build.gradle"
          grep -Fq "signingConfig signingConfigs.alislah" "$PACK/app/build.gradle"
          grep -Fq "dz.alislah.voicepack.permission.USE" "$PACK/app/src/main/AndroidManifest.xml"
          grep -Fq "finished" "$PWD/ALISLAH-Android-v2/flutter_tts_module/lib/main.dart"
          ACTUAL_KEY_SHA256="$(keytool -list -v -keystore "$PACK/debug.keystore" -storepass android -alias androiddebugkey 2>/dev/null | awk -F': ' '/SHA256:/{gsub(":", "", $2); print toupper($2); exit}')"
          test "$ACTUAL_KEY_SHA256" = "$ALISLAH_SIGNING_CERT_SHA256"

      - name: Build optional ALISLAH Mixer-TTS voice pack
        shell: bash
        run: |
          set -euo pipefail
          gradle -p ALISLAH-Voice-Pack --no-daemon --no-build-cache --stacktrace clean assembleDebug --rerun-tasks

      - name: Verify optional voice pack APK signature
        shell: bash
        run: |
          set -euo pipefail
          APK="ALISLAH-Voice-Pack/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner -print | sort -V | tail -n 1)"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee "$RUNNER_TEMP/alislah-voice-pack-signature.txt"
          ACTUAL_APK_SHA256="$(sed -n 's/.*certificate SHA-256 digest: //p' "$RUNNER_TEMP/alislah-voice-pack-signature.txt" | head -n 1 | tr -d ':\r\n ' | tr '[:lower:]' '[:upper:]')"
          if [ "$ACTUAL_APK_SHA256" != "$ALISLAH_SIGNING_CERT_SHA256" ]; then
            echo "::error::Voice-pack signing certificate mismatch."
            exit 1
          fi
          echo "Optional voice pack signature verified."

      - name: Upload optional ALISLAH Mixer-TTS voice pack
        uses: actions/upload-artifact@v7
        with:
          name: ALISLAH-Voice-Pack-Mixer-TTS-Optional
          path: ALISLAH-Voice-Pack/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
